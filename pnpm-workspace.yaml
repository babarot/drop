# pnpm settings (newer pnpm ignores the "pnpm" field in package.json, so they live here)

# Dependencies allowed to run build scripts
onlyBuiltDependencies:
  - esbuild
  - workerd
  - "@biomejs/biome"

# Move old transitive versions flagged by Dependabot to fixed versions.
# To avoid major bumps, the ranges cover only the flagged versions
overrides:
  "undici@>=7 <7.30.1": "^7.30.1"
  "zod@>=4 <4.6.6": "^4.6.6"
  "sharp@>=0.35 <0.35.5": "^0.35.5"
  "source-map-js@<1.2.2": "^1.2.2"
  "shell-quote@<1.11.0": "^1.11.0"
  "@vitest/mocker@<4.1.12": "^4.1.12"
